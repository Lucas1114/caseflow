spring.application.name=caseflow-backend

server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:caseflow}
spring.datasource.username=${PGUSER:caseflow}
spring.datasource.password=${PGPASSWORD:caseflow}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
